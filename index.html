<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | SNHS</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom Styling & Hero Section */
    .hero-section {
      height: calc(100vh - 56px);
      min-height: 550px;
      background-image: url('SNHS1.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .hero-overlay {
      background: rgba(0, 0, 0, 0.55);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .hero-content {
      position: relative;
      z-index: 10;
    }
    .nav-logo {
      height: 40px;
      width: auto;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #0d6efd, #0dcaf0);
      color: #fff;
      border: none;
      border-radius: 50rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
      color: #fff;
    }
  </style>
</head>
<body class="bg-light">

  <!-- Header / Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="SNHS.jpg" alt="Logo" class="nav-logo rounded-circle">
        <span class="fw-bold">Computer Laboratory Scheduling And Monitoring System</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto fs-6">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="navSecondPage">Explore</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Clean Static Hero Section -->
  <div class="hero-section d-flex align-items-center justify-content-center text-center shadow">
    <div class="hero-overlay"></div>
    <div class="container hero-content text-white px-3">
      <h1 class="display-4 fw-bold mb-3">Santiago National High School</h1>
      <p class="lead fs-4 mb-4 text-light opacity-75">Computer Laboratory Scheduling and Monitoring System</p>
      <!-- Updated link to index.html -->
      <a href="loginform.html" class="btn btn-gradient btn-lg px-5 py-3 fw-semibold shadow">Login to System</a>
    </div>
  </div>

  <!-- Bootstrap JS (bundle includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- JavaScript Navigation Handler -->
  <script>
    const secondPageUrl = "loginform.html";

    document.getElementById("navSecondPage").addEventListener("click", function(e) {
      e.preventDefault();
      window.location.href = secondPageUrl;
    });
  </script>
</body>
</html>
