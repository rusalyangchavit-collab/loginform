<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Milo</title>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Boxicons for clean UI icons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #020410;
            color: #e4e4e4;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Navigation Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 10%;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .navbar a {
            position: relative;
            font-size: 15px;
            color: #e4e4e4;
            text-decoration: none;
            font-weight: 500;
            margin-right: 30px;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            background: #e4e4e4;
            border-radius: 5px;
            transform: translateY(10px);
            opacity: 0;
            transition: 0.4s;
        }

        .navbar a:hover::after {
            transform: translateY(0);
            opacity: 1;
        }

        .search-bar {
            width: 240px;
            height: 40px;
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            display: flex;
            align-items: center;
        }

        .search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            color: #e4e4e4;
            padding-left: 12px;
        }

        .search-bar input::placeholder {
            color: #e4e4e4;
        }

        .search-bar button {
            width: 40px;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .search-bar button i {
            font-size: 20px;
            color: #e4e4e4;
        }

        /* Full-screen Scenic Sunset/Twilight Background */
        .background {
            width: 100%;
            height: 100vh;
            background: linear-gradient(rgba(10, 15, 45, 0.45), rgba(15, 10, 35, 0.65)),
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            filter: blur(8px);
            transform: scale(1.03);
        }

        /* Main Split Card Container */
        .container {
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 78%;
            max-width: 1020px;
            height: 550px;
            background: linear-gradient(rgba(10, 15, 45, 0.25), rgba(15, 10, 35, 0.35)),
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            display: flex;
            overflow: hidden;
        }

        /* Left Welcome Panel */
        .container .content {
            width: 56%;
            height: 100%;
            padding: 60px 55px;
            color: #e4e4e4;
            display: flex;
            justify-content: space-between;
            flex-direction: column;
        }

        .content .logo {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .text-sci h2 {
            font-size: 38px;
            line-height: 1.15;
            font-weight: 700;
        }

        .text-sci h2 span {
            font-size: 22px;
            font-weight: 600;
            display: block;
            margin-top: 6px;
        }

        .text-sci p {
            font-size: 14px;
            margin: 18px 0 24px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            max-width: 390px;
        }

        .social-icons a i {
            font-size: 20px;
            color: #e4e4e4;
            margin-right: 14px;
            transition: 0.3s ease;
        }

        .social-icons a:hover i {
            transform: scale(1.2);
            color: #ff2e63;
        }

        /* Right Glassmorphic Auth Box */
        .container .logreg-box {
            position: relative;
            width: 44%;
            height: 100%;
            overflow: hidden;
        }

        .logreg-box .form-box {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0 42px;
            background: rgba(18, 22, 54, 0.38);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.6s ease-in-out;
        }

        .logreg-box .form-box.login {
            transform: translateX(0);
        }
        .logreg-box.active .form-box.login {
            transform: translateX(100%);
        }

        .logreg-box .form-box.register {
            transform: translateX(100%);
        }
        .logreg-box.active .form-box.register {
            transform: translateX(0);
        }

        .form-box form {
            width: 100%;
        }

        .form-box h2 {
            font-size: 30px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error {
            color: #ff6b81;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 46px;
            border-bottom: 2px solid #e4e4e4;
            margin: 22px 0;
        }

        .form-box.register .input-box {
            margin: 15px 0;
            height: 42px;
        }

        .input-box input,
        .input-box select {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            color: #e4e4e4;
            font-weight: 500;
            padding-right: 28px;
        }

        .input-box select option {
            background: #141838;
            color: #fff;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            transition: 0.4s ease;
            color: rgba(255, 255, 255, 0.85);
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label,
        .input-box select:focus ~ label,
        .input-box select:valid ~ label {
            top: -5px;
            font-size: 12px;
            color: #ff4d79;
        }

        .input-box .icon {
            position: absolute;
            top: 12px;
            right: 2px;
            font-size: 18px;
            color: #e4e4e4;
        }

        .remember-forgot {
            font-size: 13px;
            font-weight: 500;
            margin: -8px 0 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .remember-forgot label input {
            accent-color: #c4103d;
            margin-right: 6px;
            cursor: pointer;
        }

        .remember-forgot a {
            color: #e4e4e4;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background: #c4103d;
            border: none;
            outline: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            color: #e4e4e4;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(196, 16, 61, 0.45);
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-submit:hover {
            background: #e01648;
            transform: translateY(-1px);
        }

        .login-register {
            font-size: 13.5px;
            font-weight: 500;
            text-align: center;
            margin-top: 20px;
        }

        .login-register p a {
            color: #e4e4e4;
            font-weight: 600;
            text-decoration: none;
            margin-left: 4px;
            cursor: pointer;
        }

        .login-register p a:hover {
            text-decoration: underline;
            color: #ff4d79;
        }

        @media (max-width: 900px) {
            .header { padding: 20px 5%; }
            .navbar { display: none; }
            .container { width: 92%; height: auto; min-height: 540px; flex-direction: column; top: 54%; }
            .container .content { display: none; }
            .container .logreg-box { width: 100%; height: 540px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
        <form class="search-bar" onsubmit="event.preventDefault();">
            <input type="text" placeholder="Search...">
            <button type="submit"><i class='bx bx-search'></i></button>
        </form>
    </header>

    <div class="background"></div>

    <div class="container">
        <div class="content">
            <h2 class="logo"><i class='bx bxl-firebase'></i> Milo</h2>
            <div class="text-sci">
                <h2>Welcome!<br><span>To Milo Login System</span></h2>
                <p>Computer Laboratory Scheduling and Monitoring System</p>
                <div class="social-icons">
                    <a href="#"><i class='bx bxl-linkedin'></i></a>
                    <a href="https://www.facebook.com/john.kenneth.milo.2025"><i class='bx bxl-facebook'></i></a>
                    <a href="#"><i class='bx bxl-instagram'></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                </div>
            </div>
        </div>

        <div class="logreg-box" id="logregBox">
            <!-- Sign In (Login) Form -->
            <div class="form-box login">
                <form id="logForm">
                    <h2>Sign In</h2>
                    <div id="login-error" class="error"></div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-envelope'></i></span>
                        <input type="email" id="log-email" required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                        <input type="password" id="log-password" required>
                        <label>Password</label>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-submit">Sign In</button>
                    <div class="login-register">
                        <p>Don't have an account? <a onclick="switchForm('register')">Sign up</a></p>
                    </div>
                </form>
            </div>

            <!-- Sign Up (Register) Form -->
            <div class="form-box register">
                <form id="regForm">
                    <h2>Sign Up</h2>
                    <div id="register-error" class="error"></div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-user'></i></span>
                        <input type="text" id="reg-name" required>
                        <label>Full Name</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-envelope'></i></span>
                        <input type="email" id="reg-email" required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                        <input type="password" id="reg-password" required>
                        <label>Password</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-id-card'></i></span>
                        <select id="reg-role" required>
                            <option value="user" selected>User</option>
                            <option value="admin">Admin</option>
                        </select>
                        <label>Role</label>
                    </div>
                    <button type="submit" class="btn-submit">Register</button>
                    <div class="login-register">
                        <p>Already have an account? <a onclick="switchForm('login')">Sign in</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & Client Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCVbXGB2lJJO1PHYBHcQt5_D7Upmr2aolU",
            authDomain: "login-form-c307d.firebaseapp.com",
            projectId: "login-form-c307d",
            storageBucket: "login-form-c307d.firebasestorage.app",
            messagingSenderId: "207345895701",
            appId: "1:207345895701:web:6d5f743dc248c48f60c11c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchForm = function(formType) {
            const logregBox = document.getElementById('logregBox');
            document.getElementById('login-error').textContent = "";
            document.getElementById('register-error').textContent = "";

            if (formType === 'register') {
                logregBox.classList.add('active');
            } else {
                logregBox.classList.remove('active');
            }
        };

        // Registration Handler
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const errorDiv = document.getElementById('register-error');
            errorDiv.textContent = "";

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    errorDiv.textContent = "Email is already registered!";
                    return;
                }

                await addDoc(collection(db, "users"), {
                    name: name,
                    email: email,
                    password: password,
                    role: role
                });

                alert("Registration successful! Please sign in.");
                document.getElementById('regForm').reset();
                switchForm('login');
            } catch (err) {
                console.error("Firebase Registration Error: ", err);
                errorDiv.textContent = "Error: " + err.message;
            }
        });

        // Login Handler (Safely handles missing role fields in old documents)
        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('log-email').value;
            const password = document.getElementById('log-password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.textContent = "";

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    errorDiv.textContent = "Incorrect email or password";
                    return;
                }

                let userData = null;
                querySnapshot.forEach((doc) => {
                    userData = doc.data();
                });

                if (userData.password === password) {
                    sessionStorage.setItem('name', userData.name || "User");
                    sessionStorage.setItem('email', userData.email);

                    // Safely default to 'user' role if the database entry doesn't have a role field yet
                    const userRole = (userData.role || "user").toLowerCase();

                    if (userRole === 'admin') {
                        window.location.href = "admin_page.html";
                    } else {
                        window.location.href = "user_page.html";
                    }
                } else {
                    errorDiv.textContent = "Incorrect email or password";
                }
            } catch (err) {
                console.error("Firebase Login Error: ", err);
                errorDiv.textContent = "Error during login.";
            }
        });
    </script>
</body>
</html>
